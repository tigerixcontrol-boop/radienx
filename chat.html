<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>RADIEN — CHAT GLOBAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ═══════════════════════════════════════════════════════════
     GANTI FONT SESUAI BRAND ANDA (opsional)
     ═══════════════════════════════════════════════════════════ -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ═══════════════════════════════════════════════════════════
     FIREBASE SDK — biarkan seperti ini (versi 10.12.2)
     ═══════════════════════════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --white:#ffffff;
  --rgbBorder:linear-gradient(135deg,#666,#ffffff,#bbbbbb,#ffffff,#666);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;}
body{
  background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.06),transparent 42%),
    radial-gradient(circle at 85% 30%,rgba(255,255,255,.05),transparent 46%),
    radial-gradient(circle at 50% 90%,rgba(255,255,255,.05),transparent 46%),
    #050505;
  color:#fff;
  font-family:'Rajdhani',Arial,Helvetica,sans-serif;
  display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:34px 34px;pointer-events:none;z-index:0;
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#888;border-radius:20px;}

/* ═══ HEADER ═══ */
.chat-header{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;gap:12px;
  background:linear-gradient(180deg,rgba(0,0,0,.95),rgba(0,0,0,.6));
  border-bottom:1px solid rgba(255,255,255,.18);
  position:relative;z-index:10;
}
.chat-header-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1;}
.back-btn{
  width:42px;height:42px;border-radius:14px;border:1.5px solid transparent;
  background:linear-gradient(145deg,#161616,#0a0a0a) padding-box,var(--rgbBorder) border-box;
  color:#fff;font-size:20px;font-family:Arial,sans-serif;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.back-btn:active{transform:scale(.94);}
.header-info{min-width:0;flex:1;}
.header-info h1{
  font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;
  letter-spacing:1.5px;color:#fff !important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.header-info p{
  font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;
  letter-spacing:1px;color:#aaa !important;margin-top:3px;
  display:flex;align-items:center;gap:6px;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle,#fff,#aaa);
  box-shadow:0 0 6px rgba(255,255,255,.9);
  animation:pulseDot 1.6s infinite;
}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ═══ MESSAGES ═══ */
.chat-messages{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 12px 10px;
  display:flex;flex-direction:column;gap:10px;
  position:relative;z-index:1;
}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:#888;border-radius:20px;}

.msg-row{
  display:flex;gap:8px;max-width:88%;
  align-items:flex-end;
  animation:msgIn .22s ease-out;
  user-select:none;-webkit-user-select:none;
}
.msg-row.own{align-self:flex-end;flex-direction:row-reverse;}
.msg-row.other{align-self:flex-start;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.msg-avatar{
  width:32px;height:32px;border-radius:50%;
  border:2px solid transparent;padding:1px;overflow:hidden;flex-shrink:0;
  background:linear-gradient(145deg,#0a0a0a,#050505) padding-box,var(--rgbBorder) border-box;
}
.msg-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;filter:grayscale(100%);}
.msg-avatar .fallback{
  width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#1a1a1a;font-family:'Orbitron',sans-serif;
  font-size:11px;font-weight:900;color:#fff !important;
}

.msg-bubble{
  border-radius:16px;padding:10px 13px;
  max-width:100%;word-break:break-word;position:relative;
  background:linear-gradient(145deg,#1e1e1e,#121212) padding-box,
             linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.1)) border-box;
  border:1.5px solid transparent;
  color:#ffffff !important;
  transition:transform .12s;
}
.msg-bubble.pressing{transform:scale(.97);}
.msg-row.own .msg-bubble{
  background:linear-gradient(145deg,#ffffff,#f0f0f0) padding-box,
             linear-gradient(135deg,#ffffff,#dddddd) border-box;
  color:#080808 !important;
}

.msg-reply-quote{
  border-left:3px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.08);
  border-radius:8px;
  padding:6px 9px;
  margin-bottom:7px;
  cursor:pointer;
  max-width:100%;
}
.msg-row.own .msg-reply-quote{
  border-left-color:#080808;
  background:rgba(0,0,0,.08);
}
.msg-reply-name{
  font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:900;
  letter-spacing:.5px;color:#a0d0ff !important;
  margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.msg-row.own .msg-reply-name{color:#080808 !important;opacity:.7;}
.msg-reply-text{
  font-size:11.5px;font-weight:500;line-height:1.35;
  color:#dddddd !important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.msg-row.own .msg-reply-text{color:#080808 !important;opacity:.7;}

.msg-name{
  font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:900;
  letter-spacing:.5px;color:#a0d0ff !important;
  margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.msg-row.own .msg-name{color:#080808 !important;opacity:.55;}

.msg-text{
  font-size:14.5px;line-height:1.45;font-weight:500;
  white-space:pre-wrap;word-break:break-word;
  color:#ffffff !important;
}
.msg-row.own .msg-text{color:#080808 !important;}

.msg-meta{
  display:flex;align-items:center;justify-content:flex-end;gap:6px;
  margin-top:4px;font-family:'Orbitron',sans-serif;
  font-size:7.5px;font-weight:800;letter-spacing:.6px;
  color:#b0b0b0 !important;
}
.msg-row.own .msg-meta{color:#080808 !important;opacity:.55;}

.msg-media-img{
  max-width:240px;max-height:320px;border-radius:12px;
  display:block;object-fit:cover;cursor:pointer;
  filter:grayscale(100%);
}

.msg-voice{
  display:flex;align-items:center;gap:10px;
  min-width:180px;padding:2px 0;
}
.voice-play{
  width:40px;height:40px;border-radius:50%;
  background:#ffffff;border:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .1s;
}
.voice-play:active{transform:scale(.92);}
.voice-play svg{width:16px;height:16px;color:#080808 !important;fill:#080808 !important;}
.msg-row.own .voice-play{background:#080808;}
.msg-row.own .voice-play svg{color:#fff !important;fill:#fff !important;}

.voice-bar{
  flex:1;height:6px;border-radius:20px;
  background:rgba(255,255,255,.2);
  position:relative;overflow:hidden;min-width:80px;
}
.msg-row.own .voice-bar{background:rgba(0,0,0,.15);}
.voice-bar-fill{
  position:absolute;left:0;top:0;bottom:0;width:0;
  background:#ffffff;border-radius:20px;
  transition:width .12s linear;
}
.msg-row.own .voice-bar-fill{background:#080808;}
.voice-time{
  font-family:'Orbitron',sans-serif;font-size:9px;font-weight:800;
  color:#ffffff !important;flex-shrink:0;letter-spacing:.5px;
}
.msg-row.own .voice-time{color:#080808 !important;}

.chat-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;text-align:center;padding:40px 24px;gap:14px;
}
.chat-empty svg{width:60px;height:60px;color:#444;}
.chat-empty h2{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:1.5px;color:#fff !important;}
.chat-empty p{font-size:12px;color:#888 !important;max-width:260px;line-height:1.5;font-weight:600;}

.reply-bar{
  flex-shrink:0;
  display:none;
  align-items:center;gap:10px;
  padding:8px 14px;
  background:linear-gradient(180deg,#0d0d0d,#050505);
  border-top:1px solid rgba(255,255,255,.15);
  position:relative;z-index:9;
  animation:slideDown .2s ease-out;
}
.reply-bar.active{display:flex;}
@keyframes slideDown{from{transform:translateY(-10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.reply-bar-accent{
  width:3px;height:34px;border-radius:3px;background:#ffffff;flex-shrink:0;
}
.reply-bar-content{
  flex:1;min-width:0;
}
.reply-bar-label{
  font-family:'Orbitron',sans-serif;font-size:8px;font-weight:900;
  letter-spacing:1px;color:#a0d0ff !important;margin-bottom:2px;
}
.reply-bar-text{
  font-size:12px;font-weight:500;color:#ddd !important;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.reply-bar-close{
  width:32px;height:32px;border-radius:50%;border:0;
  background:rgba(255,255,255,.08);color:#fff !important;
  font-size:18px;font-family:Arial,sans-serif;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.reply-bar-close:active{background:rgba(255,255,255,.15);}

.chat-input-bar{
  flex-shrink:0;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(0,0,0,.98),rgba(0,0,0,.7));
  border-top:1px solid rgba(255,255,255,.18);
  display:flex;align-items:flex-end;gap:8px;
  position:relative;z-index:10;
}
.input-btn{
  width:44px;height:44px;border-radius:50%;border:1.5px solid transparent;
  background:linear-gradient(145deg,#161616,#0a0a0a) padding-box,var(--rgbBorder) border-box;
  color:#fff;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.input-btn:active{transform:scale(.92);}
.input-btn svg{width:20px;height:20px;color:#fff !important;stroke:#fff !important;}
.input-btn.record-btn.recording{
  background:#ffffff !important;background-image:none !important;
  animation:recPulse 1s infinite;
}
.input-btn.record-btn.recording svg{color:#080808 !important;stroke:#080808 !important;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6);}50%{box-shadow:0 0 0 10px rgba(255,255,255,0);}}

.text-input-wrap{
  flex:1;min-width:0;
  border-radius:22px;border:1.5px solid transparent;
  background:linear-gradient(145deg,#0d0d0d,#050505) padding-box,var(--rgbBorder) border-box;
  display:flex;align-items:center;padding:0 8px 0 14px;
  min-height:44px;max-height:120px;
}
.text-input{
  flex:1;border:0;outline:none;background:transparent;
  color:#fff !important;-webkit-text-fill-color:#fff !important;
  font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;
  resize:none;max-height:100px;padding:11px 0;line-height:1.35;
}
.text-input::placeholder{color:#777 !important;-webkit-text-fill-color:#777 !important;}

.send-btn{
  width:44px;height:44px;border-radius:50%;border:0;
  background:#ffffff;color:#080808;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s;
}
.send-btn:active{transform:scale(.92);}
.send-btn:disabled{opacity:.4;cursor:not-allowed;}
.send-btn svg{width:20px;height:20px;color:#080808 !important;stroke:#080808 !important;}

.msg-menu-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;align-items:flex-end;justify-content:center;
  z-index:700;padding:0;
  opacity:0;transition:opacity .2s;
}
.msg-menu-overlay.active{display:flex;opacity:1;}
.msg-menu-sheet{
  width:100%;max-width:520px;
  border:2px solid transparent;border-bottom:0;
  border-radius:28px 28px 0 0;
  background:linear-gradient(160deg,#161616,#080808) padding-box,
             linear-gradient(90deg,#333,#fff,#555,#fff,#333) border-box;
  padding:12px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(110%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -8px 30px rgba(255,255,255,.1);
  max-height:80vh;overflow-y:auto;
}
.msg-menu-overlay.active .msg-menu-sheet{transform:translateY(0);}
.msg-menu-handle{
  width:42px;height:4px;border-radius:10px;background:#fff;
  margin:0 auto 18px;
}
.msg-menu-preview{
  padding:10px 14px;border-radius:14px;
  background:linear-gradient(145deg,#0d0d0d,#050505) padding-box,var(--rgbBorder) border-box;
  border:1.5px solid transparent;
  margin-bottom:14px;
}
.msg-menu-preview-label{
  font-family:'Orbitron',sans-serif;font-size:8px;font-weight:900;
  letter-spacing:1.2px;color:#a0d0ff !important;margin-bottom:5px;
}
.msg-menu-preview-text{
  font-size:12px;font-weight:500;color:#ddd !important;
  line-height:1.4;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.msg-menu-item{
  width:100%;
  display:flex;align-items:center;gap:14px;
  padding:15px 16px;
  border:0;background:transparent;
  border-radius:16px;
  color:#fff !important;
  font-family:'Orbitron',sans-serif;
  font-size:11px;font-weight:900;
  letter-spacing:1px;
  cursor:pointer;
  text-align:left;
  transition:background .15s;
  margin-bottom:6px;
}
.msg-menu-item:last-child{margin-bottom:0;}
.msg-menu-item:active{background:rgba(255,255,255,.08);}
.msg-menu-item svg{
  width:20px;height:20px;
  color:#fff !important;stroke:#fff !important;
  flex-shrink:0;
}
.msg-menu-item.danger{
  color:#ff5a5a !important;
}
.msg-menu-item.danger svg{
  color:#ff5a5a !important;stroke:#ff5a5a !important;
}
.msg-menu-item.hidden{display:none;}

.rec-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.88);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;z-index:800;padding:20px;
}
.rec-overlay.active{display:flex;}
.rec-ring{
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);
  border:3px solid rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;
  animation:recRing 1.4s infinite;
}
@keyframes recRing{0%,100%{transform:scale(1);border-color:rgba(255,255,255,.4);}50%{transform:scale(1.08);border-color:rgba(255,255,255,.9);}}
.rec-ring svg{width:50px;height:50px;color:#fff !important;stroke:#fff !important;}
.rec-time{
  font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;
  letter-spacing:3px;color:#fff !important;
}
.rec-hint{
  font-family:'Orbitron',sans-serif;font-size:10px;
  letter-spacing:2px;color:#aaa !important;font-weight:800;
  text-align:center;line-height:1.6;
}
.rec-actions{display:flex;gap:14px;margin-top:10px;}
.rec-btn{
  padding:14px 26px;border-radius:16px;border:1.5px solid transparent;
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;
  letter-spacing:1.2px;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.rec-btn.cancel{
  background:linear-gradient(145deg,#1a1a1a,#0a0a0a) padding-box,var(--rgbBorder) border-box;
  color:#fff !important;
}
.rec-btn.stop{background:#fff;color:#080808 !important;}
.rec-btn svg{width:14px;height:14px;color:inherit !important;stroke:currentColor !important;}

.img-preview-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.95);
  display:none;flex-direction:column;z-index:820;
}
.img-preview-overlay.active{display:flex;}
.img-preview-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.15);
  flex-shrink:0;
}
.img-preview-title{
  font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;
  letter-spacing:1.5px;color:#fff !important;
}
.img-preview-close{
  width:42px;height:42px;border-radius:14px;border:0;
  background:#fff;color:#080808;font-size:22px;
  font-family:Arial,sans-serif;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.img-preview-body{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:15px;overflow:hidden;
}
.img-preview-body img{
  max-width:100%;max-height:100%;object-fit:contain;
  filter:grayscale(100%);border-radius:12px;
}
.img-preview-bottom{
  padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.15);
  display:flex;gap:10px;flex-shrink:0;
}
.img-preview-bottom button{
  flex:1;height:54px;border-radius:16px;border:0;
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;
  letter-spacing:1.2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.img-btn-cancel{
  background:linear-gradient(145deg,#1a1a1a,#0a0a0a) padding-box,var(--rgbBorder) border-box;
  border:1.5px solid transparent !important;color:#fff !important;
}
.img-btn-send{background:#fff;color:#080808 !important;}
.img-preview-bottom button svg{width:15px;height:15px;color:inherit !important;stroke:currentColor !important;}

.img-viewer{
  position:fixed;inset:0;background:#000;z-index:850;
  display:none;flex-direction:column;
}
.img-viewer.active{display:flex;}
.img-viewer-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.15);
  flex-shrink:0;
}
.img-viewer-body{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:10px;overflow:hidden;
}
.img-viewer-body img{
  max-width:100%;max-height:100%;object-fit:contain;
  filter:grayscale(100%);
}

.toast{
  position:fixed;left:50%;bottom:100px;
  transform:translate(-50%,20px);
  border:2px solid transparent;border-radius:16px;
  padding:13px 18px;
  background:linear-gradient(145deg,#151515,#050505) padding-box,var(--rgbBorder) border-box;
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:800;
  letter-spacing:.5px;color:#fff !important;
  opacity:0;visibility:hidden;transition:.25s;z-index:900;
  max-width:90vw;text-align:center;
  box-shadow:0 0 20px rgba(255,255,255,.15);
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}

.confirm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);
  display:none;align-items:center;justify-content:center;
  padding:22px;z-index:950;
}
.confirm-overlay.active{display:flex;}
.confirm-box{
  width:100%;max-width:380px;
  border:2px solid transparent;border-radius:26px;
  padding:24px 22px;
  background:linear-gradient(160deg,#181818,#080808) padding-box,linear-gradient(90deg,#333,#fff,#555,#fff,#333) border-box;
}
.confirm-box h3{
  font-family:'Orbitron',sans-serif;font-size:13px;font-weight:900;
  letter-spacing:1.2px;color:#fff !important;margin-bottom:10px;text-align:center;
}
.confirm-box p{
  font-size:13px;line-height:1.55;color:#ccc !important;
  font-weight:600;text-align:center;margin-bottom:20px;
}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.confirm-btn{
  height:50px;border-radius:16px;border:0;
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;
  letter-spacing:1.2px;cursor:pointer;
}
.confirm-btn.cancel{
  background:linear-gradient(145deg,#1a1a1a,#0a0a0a) padding-box,var(--rgbBorder) border-box;

<body>

<!-- HEADER -->

<!-- MESSAGES -->
<div class="chat-messages" id="chatMessages">
  <div class="chat-empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

</div>

<!-- REPLY PREVIEW BAR -->
<div class="reply-bar" id="replyBar">
  <div class="reply-bar-accent"></div>
  <div class="reply-bar-content">
    <div class="reply-bar-label" id="replyBarLabel">Membalas</div>

  </div>

</div>

<!-- INPUT BAR -->
<div class="chat-input-bar">
  <button class="input-btn" onclick="document.getElementById('photoInput').click()" title="Kirim Foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2.5"/>

  <div class="text-input-wrap">

<!-- IMAGE PREVIEW -->

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ⚡⚡⚡ KONFIGURASI FIREBASE ⚡⚡⚡
   ═══════════════════════════════════════════════════════════════════════════
   GANTI SEMUA VALUE DI BAWAH INI DENGAN MILIK ANDA:

   1. Buka Firebase Console → Project Settings → General
   2. Scroll ke "Your apps" → pilih Web App
   3. Copy config dan paste ke sini
   4. Pastikan Realtime Database sudah dibuat (bukan Firestore)
   ═══════════════════════════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyDLs7Coar_Dy9bE2K4Ha_Q6wG0SmC3m75g",
    //        ↑ GANTI dengan API Key Anda

    authDomain: "https://radien-95e9d.firebaseapp.com",
    //            ↑ GANTI dengan Auth Domain Anda

    databaseURL: "https://radien-95e9d-default-rtdb.asia-southeast1.firebasedatabase.app",
    //             ↑ GANTI dengan Realtime Database URL Anda

    projectId: "radien-95e9d",
    //           ↑ GANTI dengan Project ID Anda

    storageBucket: "https://radien-95e9d.firebasestorage.app",
    //               ↑ GANTI dengan Storage Bucket Anda

    messagingSenderId: "208676450122",
    //                   ↑ GANTI dengan Messaging Sender ID Anda

    appId: "13f1702562e36468a4dbb3"
    //      ↑ GANTI dengan App ID Anda
};

let DB = null;
let FB_READY = false;
let CURRENT_USER = null;

try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    DB = firebase.database();
    FB_READY = true;
} catch(e) { console.error("[FB] Init error:", e); }

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ KONFIGURASI CHAT
   ═══════════════════════════════════════════════════════════════════════════
   Sesuaikan dengan preferensi Anda (jarang perlu diubah)
   ═══════════════════════════════════════════════════════════════════════════ */
const CHAT_PATH = "chat_global/messages";
//                 ↑ Path Firebase untuk chat global (jarang perlu diubah)

const MAX_IMAGE_SIZE = 900 * 1024;  // Max ukuran gambar setelah kompres (900 KB)
const MAX_VOICE_SIZE = 900 * 1024;  // Max ukuran voice (900 KB)
const IMG_MAX_DIM = 900;            // Max dimensi gambar (px)
const IMG_QUALITY = 0.72;           // Kualitas JPEG (0-1)
const MAX_MESSAGES_SHOWN = 300;     // Max pesan yang ditampilkan (biar gak lag)

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ SESSION STORAGE KEYS
   ⚠️ WAJIB SAMA dengan file login.html dan home.html
   ═══════════════════════════════════════════════════════════════════════════ */
const SESSION_KEY_SESSION = "astra_session";
//                            ↑ GANTI kalau perlu
const SESSION_KEY_USERS = "astra_users";
//                          ↑ GANTI kalau perlu (harus SAMA dengan login.html)

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ STATE
   ═══════════════════════════════════════════════════════════════════════════ */
let allMessages = [];
let rawMessages = [];
let messageListener = null;
let lastRenderedId = null;
let photoPendingData = null;

let mediaRecorder = null;
let recordedChunks = [];
let recordStream = null;
let recordingStartAt = 0;
let recordingTimerInt = null;
let recordingAborted = false;

let confirmCallback = null;

let currentAudio = null;
let currentAudioBtn = null;
let currentAudioFill = null;
let currentAudioId = null;

let replyTarget = null;
let menuTargetId = null;

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ SESSION
   ═══════════════════════════════════════════════════════════════════════════ */
function loadCurrentUser() {
    try {
        const sess = localStorage.getItem(SESSION_KEY_SESSION);
        const users = localStorage.getItem(SESSION_KEY_USERS);
        if (!sess || !users) return null;
        const session = JSON.parse(sess);
        const all = JSON.parse(users);
        const uname = (session.username || "").toLowerCase();
        const u = all[uname];
        if (!u) return null;
        return {
            username: uname,
            name: u.name || u.username || "USER",
            avatar: u.avatar || "profile.png"
            //         ↑ GANTI dengan file avatar default Anda
        };
    } catch(e) { return null; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ LOCAL STORAGE — Deleted for me
   ═══════════════════════════════════════════════════════════════════════════ */
function getDeletedIdsKey() {
    return "astra_chat_deleted_" + (CURRENT_USER ? CURRENT_USER.username : "guest");
    //      ↑ GANTI prefix "astra_" kalau perlu
}
function getDeletedIds() {
    try {
        const raw = localStorage.getItem(getDeletedIdsKey());
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
    } catch(e) { return []; }
}
function addDeletedId(id) {
    const list = getDeletedIds();
    if (!list.includes(id)) list.push(id);
    const trimmed = list.slice(-1000);
    try { localStorage.setItem(getDeletedIdsKey(), JSON.stringify(trimmed)); } catch(e){}
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ UTIL
   ═══════════════════════════════════════════════════════════════════════════ */
function esc(str) {
    if (str === null || str === undefined) return "";
    return String(str)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), 2400);
}
function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const same = d.toDateString() === now.toDateString();
    const time = d.toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit", hour12:false});
    if (same) return time;
    const date = d.toLocaleDateString("id-ID", {day:"2-digit", month:"short"});
    return date + " • " + time;
}
function formatDur(sec) {
    sec = Math.max(0, Math.floor(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}
function shortName(name) {
    return (name || "?").trim().charAt(0).toUpperCase() || "?";
}
function goBack() {
    if (currentAudio) { try { currentAudio.pause(); } catch(e){} }
    if (window.history.length > 1) window.history.back();
    else {
        /* ═══════════════════════════════════════════════════════════════════
           ⚡ GANTI PATH FALLBACK REDIRECT
           Kalau user buka halaman ini langsung (bukan dari history),
           akan diarahkan ke halaman ini.
           ═══════════════════════════════════════════════════════════════════ */
        window.location.href = "home.html";
        //                      ↑ GANTI ke halaman utama Anda
    }
}
function getPreviewText(m) {
    if (!m) return "";
    if (m.type === "image") return "📷 Foto";
    if (m.type === "voice") return "🎤 Voice • " + formatDur(m.duration);
    return m.text || "";
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ INIT
   ═══════════════════════════════════════════════════════════════════════════ */
function initChat() {
    CURRENT_USER = loadCurrentUser();
    if (!CURRENT_USER) {
        document.getElementById("chatStatus").textContent = "TIDAK LOGIN";
        document.getElementById("chatMessages").innerHTML =
            '<div class="chat-empty">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>' +
                '<h2>TIDAK LOGIN</h2>' +
                /* ═══════════════════════════════════════════════════════════════
                   GANTI "ASTRA" DI BAWAH INI DENGAN BRAND ANDA
                   ═══════════════════════════════════════════════════════════════ */
                '<p>Kamu harus login dulu di aplikasi RADIEN untuk bisa menggunakan Chat Global.</p>' +
            '</div>';
        return;
    }
    document.getElementById("chatStatus").textContent = "LIVE • " + CURRENT_USER.name.toUpperCase();
    setupTextInput();
    setupLongPress();
    setupMessageListener();
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ TEXT INPUT
   ═══════════════════════════════════════════════════════════════════════════ */
function setupTextInput() {
    const ta = document.getElementById("textInput");
    ta.addEventListener("input", autoGrowTextarea);
    ta.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendTextMessage();
        }
    });
}
function autoGrowTextarea() {
    const ta = document.getElementById("textInput");
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 100) + "px";
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ FIREBASE LISTENER
   ═══════════════════════════════════════════════════════════════════════════ */
function setupMessageListener() {
    if (!FB_READY) {
        document.getElementById("chatStatus").textContent = "FIREBASE OFFLINE";
        return;
    }
    if (messageListener) { try { messageListener.off(); } catch(e){} messageListener = null; }
    messageListener = DB.ref(CHAT_PATH).limitToLast(MAX_MESSAGES_SHOWN);
    messageListener.on("value", (snap) => {
        const val = snap.val() || {};
        const list = [];
        for (const key in val) {
            if (!val.hasOwnProperty(key)) continue;
            const m = val[key];
            if (!m || typeof m !== "object") continue;
            const item = {
                id: key,
                username: String(m.username || ""),
                name: String(m.name || "Unknown"),
                avatar: String(m.avatar || ""),
                type: String(m.type || "text"),
                text: String(m.text || ""),
                media: String(m.media || ""),
                duration: parseFloat(m.duration || 0) || 0,
                timestamp: parseInt(m.timestamp || 0, 10) || 0,
                replyTo: null
            };
            if (m.replyTo && typeof m.replyTo === "object") {
                item.replyTo = {
                    id: String(m.replyTo.id || ""),
                    username: String(m.replyTo.username || ""),
                    name: String(m.replyTo.name || ""),
                    preview: String(m.replyTo.preview || "")
                };
            }
            list.push(item);
        }
        list.sort((a, b) => a.timestamp - b.timestamp);
        rawMessages = list;

        const deletedIds = getDeletedIds();
        allMessages = list.filter(m => !deletedIds.includes(m.id));

        renderMessages();
    }, (err) => {
        console.error("[CHAT] Listener error:", err);
        document.getElementById("chatStatus").textContent = "ERROR";
        toast("Gagal memuat chat: " + (err.message || ""));
    });
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ RENDER
   ═══════════════════════════════════════════════════════════════════════════ */
function renderMessages() {
    const box = document.getElementById("chatMessages");
    if (!box) return;
    if (allMessages.length === 0) {
        box.innerHTML =
            '<div class="chat-empty">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>' +
                '<h2>BELUM ADA PESAN</h2>' +
                /* ═══════════════════════════════════════════════════════════════
                   GANTI "ASTRA" DI BAWAH INI DENGAN BRAND ANDA
                   ═══════════════════════════════════════════════════════════════ */
                '<p>Jadilah yang pertama mengirim pesan di Chat Global RADIEN!</p>' +
            '</div>';
        lastRenderedId = null;
        return;
    }
    const html = allMessages.map(m => renderMessageHTML(m)).join("");
    box.innerHTML = html;
    const newest = allMessages[allMessages.length - 1];
    if (!lastRenderedId || newest.id !== lastRenderedId) {
        lastRenderedId = newest.id;
        requestAnimationFrame(() => {
            box.scrollTop = box.scrollHeight;
        });
    }
}

function renderMessageHTML(m) {
    const isOwn = CURRENT_USER && m.username === CURRENT_USER.username;
    const rowClass = isOwn ? "own" : "other";

    let avatarHtml = "";
    const av = m.avatar || "";
    if (/^https?:\/\//i.test(av)) {
        avatarHtml = '<img src="' + esc(av) + '" alt="" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<div class=&quot;fallback&quot;>' + esc(shortName(m.name)) + '</div>\'">';
    } else if (av && av.length > 100) {
        avatarHtml = '<img src="' + av + '" alt="">';
    } else {
        avatarHtml = '<div class="fallback">' + esc(shortName(m.name)) + '</div>';
    }

    let replyHtml = "";
    if (m.replyTo && m.replyTo.name) {
        replyHtml =
            '<div class="msg-reply-quote" onclick="event.stopPropagation();scrollToMsg(\'' + esc(m.replyTo.id) + '\')">' +
                '<div class="msg-reply-name">' + esc(m.replyTo.name) + '</div>' +
                '<div class="msg-reply-text">' + esc(m.replyTo.preview) + '</div>' +
            '</div>';
    }

    let bodyHtml = "";
    if (m.type === "text") {
        bodyHtml = '<div class="msg-text">' + esc(m.text) + '</div>';
    } else if (m.type === "image") {
        bodyHtml = '<img class="msg-media-img" src="' + m.media + '" alt="Foto" onclick="openImageViewer(this.src)">';
    } else if (m.type === "voice") {
        const safeId = esc(m.id);
        bodyHtml =
            '<div class="msg-voice">' +
                '<button class="voice-play" data-audio-id="' + safeId + '" onclick="toggleVoicePlay(event, \'' + safeId + '\')">' +
                    '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg>' +
                '</button>' +
                '<div class="voice-bar"><div class="voice-bar-fill" id="voiceFill_' + safeId + '"></div></div>' +
                '<div class="voice-time">' + formatDur(m.duration) + '</div>' +
            '</div>';
    }

    return (
        '<div class="msg-row ' + rowClass + '" data-msg-id="' + esc(m.id) + '">' +
            '<div class="msg-avatar">' + avatarHtml + '</div>' +
            '<div class="msg-bubble">' +
                (isOwn ? '' : '<div class="msg-name">' + esc(m.name) + '</div>') +
                replyHtml +
                bodyHtml +
                '<div class="msg-meta">' + formatTime(m.timestamp) + '</div>' +
            '</div>' +
        '</div>'
    );
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ LONG PRESS
   ═══════════════════════════════════════════════════════════════════════════ */
let lpTimer = null;
let lpTargetId = null;
let lpStartX = 0, lpStartY = 0;
let lpActive = false;

function setupLongPress() {
    const box = document.getElementById("chatMessages");

    const start = (e) => {
        if (e.target.closest("button")) return;
        const row = e.target.closest(".msg-row");
        if (!row) return;

        lpTargetId = row.getAttribute("data-msg-id");
        const touch = e.touches ? e.touches[0] : e;
        lpStartX = touch.clientX;
        lpStartY = touch.clientY;
        lpActive = true;

        clearTimeout(lpTimer);
        lpTimer = setTimeout(() => {
            if (!lpActive || !lpTargetId) return;
            const bubble = row.querySelector(".msg-bubble");
            if (bubble) bubble.classList.add("pressing");
            if (navigator.vibrate) navigator.vibrate(30);
            openMsgMenu(lpTargetId);
            lpActive = false;
        }, 500);
    };

    const move = (e) => {
        if (!lpActive) return;
        const touch = e.touches ? e.touches[0] : e;
        const dx = Math.abs(touch.clientX - lpStartX);
        const dy = Math.abs(touch.clientY - lpStartY);
        if (dx > 10 || dy > 10) {
            clearTimeout(lpTimer);
            lpActive = false;
            lpTargetId = null;
        }
    };

    const end = () => {
        clearTimeout(lpTimer);
        lpActive = false;
        document.querySelectorAll(".msg-bubble.pressing").forEach(b => b.classList.remove("pressing"));
        lpTargetId = null;
    };

    box.addEventListener("touchstart", start, { passive: true });
    box.addEventListener("touchmove", move, { passive: true });
    box.addEventListener("touchend", end);
    box.addEventListener("touchcancel", end);

    box.addEventListener("mousedown", start);
    box.addEventListener("mousemove", move);
    box.addEventListener("mouseup", end);
    box.addEventListener("mouseleave", end);

    box.addEventListener("contextmenu", (e) => {
        const row = e.target.closest(".msg-row");
        if (row) {
            e.preventDefault();
            openMsgMenu(row.getAttribute("data-msg-id"));
        }
    });
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ MESSAGE MENU
   ═══════════════════════════════════════════════════════════════════════════ */
function openMsgMenu(msgId) {
    const m = allMessages.find(x => x.id === msgId);
    if (!m) return;
    menuTargetId = msgId;

    const who = (CURRENT_USER && m.username === CURRENT_USER.username) ? "PESAN ANDA" : ("DARI " + m.name.toUpperCase());
    document.getElementById("msgMenuWho").textContent = who;
    document.getElementById("msgMenuText").textContent = getPreviewText(m);

    const isOwn = CURRENT_USER && m.username === CURRENT_USER.username;
    const delAllBtn = document.getElementById("menuDeleteAllBtn");
    if (isOwn) delAllBtn.classList.remove("hidden");
    else delAllBtn.classList.add("hidden");

    document.getElementById("msgMenuOverlay").classList.add("active");
}

function closeMsgMenu(ev) {
    if (ev && ev.target !== document.getElementById("msgMenuOverlay")) return;
    document.getElementById("msgMenuOverlay").classList.remove("active");
    menuTargetId = null;
}

function menuAction(action) {
    const id = menuTargetId;
    if (!id) return;
    const m = allMessages.find(x => x.id === id) || rawMessages.find(x => x.id === id);
    if (!m) { closeMsgMenu(); return; }

    if (action === "reply") {
        closeMsgMenu();
        setReplyTarget(m);
    } else if (action === "deleteMe") {
        closeMsgMenu();
        askDeleteMe(id);
    } else if (action === "deleteAll") {
        closeMsgMenu();
        askDeleteAll(id);
    }
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ REPLY
   ═══════════════════════════════════════════════════════════════════════════ */
function setReplyTarget(m) {
    replyTarget = {
        id: m.id,
        username: m.username,
        name: m.name,
        preview: getPreviewText(m).slice(0, 120)
    };
    document.getElementById("replyBarLabel").textContent = "Membalas " + m.name;
    document.getElementById("replyBarText").textContent = replyTarget.preview;
    document.getElementById("replyBar").classList.add("active");

    const ta = document.getElementById("textInput");
    setTimeout(() => { try { ta.focus(); } catch(e){} }, 150);
}

function cancelReply() {
    replyTarget = null;
    document.getElementById("replyBar").classList.remove("active");
}

function scrollToMsg(id) {
    if (!id) return;
    const el = document.querySelector('.msg-row[data-msg-id="' + id + '"]');
    if (!el) {
        toast("Pesan asal tidak ditemukan");
        return;
    }
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    const bubble = el.querySelector(".msg-bubble");
    if (bubble) {
        const old = bubble.style.boxShadow;
        bubble.style.transition = "box-shadow .3s";
        bubble.style.boxShadow = "0 0 0 3px #ffffff";
        setTimeout(() => { bubble.style.boxShadow = old || ""; }, 1200);
    }
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ DELETE FOR ME
   ═══════════════════════════════════════════════════════════════════════════ */
function askDeleteMe(id) {
    confirmCallback = () => {
        addDeletedId(id);

        toast("Pesan disembunyikan");

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ DELETE FOR EVERYONE
   ═══════════════════════════════════════════════════════════════════════════ */
function askDeleteAll(id) {
    const m = allMessages.find(x => x.id === id) || rawMessages.find(x => x.id === id);
    if (!m) return;

    confirmCallback = () => {

    document.getElementById("confirmMsg").textContent = "Pesan akan dihapus permanen dari semua device. Yakin?";

}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ SEND TEXT
   ═══════════════════════════════════════════════════════════════════════════ */
function sendTextMessage() {
    if (!FB_READY || !CURRENT_USER) return;
    const ta = document.getElementById("textInput");
    const text = (ta.value || "").trim();
    if (!text) return;
    if (text.length > 1000) { toast("Pesan terlalu panjang (max 1000 karakter)"); return; }

    ta.value = "";
    ta.style.height = "44px";
    ta.focus();

    const msg = {
        username: CURRENT_USER.username,
        name: CURRENT_USER.name,
        avatar: CURRENT_USER.avatar,
        type: "text",
        text: text,
        media: "",
        duration: 0,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    };
    if (replyTarget) {
        msg.replyTo = {
            id: replyTarget.id,
            username: replyTarget.username,
            name: replyTarget.name,
            preview: replyTarget.preview

    });

}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ PHOTO PICK
   ═══════════════════════════════════════════════════════════════════════════ */
function handlePhotoPick(event) {
    const file = event.target.files && event.target.files[0];
    event.target.value = "";
    if (!file) return;
    if (!file.type || file.type.indexOf("image/") !== 0) {
        toast("File harus berupa gambar");
        return;
    }
    if (file.size > 8 * 1024 * 1024) {
        toast("Ukuran gambar max 8MB");
        return;
    }
    const reader = new FileReader();
    reader.onload = e => {
        compressImage(e.target.result, IMG_MAX_DIM, IMG_QUALITY, (compressed) => {
            if (!compressed) { toast("Gagal proses gambar"); return; }
            if (compressed.length > MAX_IMAGE_SIZE) {
                compressImage(e.target.result, 640, 0.6, (smaller) => {
                    if (!smaller || smaller.length > MAX_IMAGE_SIZE) {
                        toast("Gambar terlalu besar, coba pilih foto lain");
                        return;
                    }
                    showImagePreview(smaller);
                });
            } else {
                showImagePreview(compressed);
            }
        });
    };
    reader.onerror = () => toast("Gagal baca file");
    reader.readAsDataURL(file);
}
function compressImage(dataUrl, maxDim, quality, cb) {
    const img = new Image();
    img.onload = () => {
        try {
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            if (w > maxDim || h > maxDim) {
                if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
                else { w = Math.round(w * maxDim / h); h = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#0a0a0a";
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            let out;
            try { out = canvas.toDataURL("image/jpeg", quality); }
            catch(e) { out = canvas.toDataURL("image/png"); }
            cb(out);
        } catch(e) { cb(null); }
    };
    img.onerror = () => cb(null);
    img.src = dataUrl;
}
function showImagePreview(dataUrl) {
    photoPendingData = dataUrl;
    document.getElementById("imgPreviewContent").src = dataUrl;
    document.getElementById("imgPreviewOverlay").classList.add("active");
}
function closeImagePreview() {
    photoPendingData = null;
    document.getElementById("imgPreviewOverlay").classList.remove("active");
    document.getElementById("imgPreviewContent").src = "";
}
function sendPendingPhoto() {
    if (!photoPendingData || !FB_READY || !CURRENT_USER) return;
    const msg = {
        username: CURRENT_USER.username,
        name: CURRENT_USER.name,
        avatar: CURRENT_USER.avatar,
        type: "image",
        text: "",
        media: photoPendingData,
        duration: 0,
        timestamp: firebase.database.ServerValue.TIMESTAMP
    };
    if (replyTarget) {
        msg.replyTo = {
            id: replyTarget.id,
            username: replyTarget.username,
            name: replyTarget.name,
            preview: replyTarget.preview
        };
    }
    toast("Mengirim foto...");
    DB.ref(CHAT_PATH).push(msg)
        .then(() => {
            toast("✓ Foto terkirim");
            closeImagePreview();
            cancelReply();
            if (navigator.vibrate) navigator.vibrate(40);
        })
        .catch(err => {
            console.error("[CHAT] Photo send error:", err);
            toast("Gagal kirim foto: " + err.message);
        });
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ VOICE RECORDING
   ═══════════════════════════════════════════════════════════════════════════ */
async function toggleRecording() {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        stopRecordingAndSend();
        return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        toast("Browser tidak mendukung perekaman suara");
        return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordStream = stream;
        recordedChunks = [];
        recordingAborted = false;

        let mime = "";
        const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4", "audio/mpeg"];
        for (const c of candidates) {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) {
                mime = c; break;
            }
        }
        const opts = mime ? { mimeType: mime } : undefined;
        mediaRecorder = new MediaRecorder(stream, opts);
        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            if (recordStream) { recordStream.getTracks().forEach(t => t.stop()); recordStream = null; }
            if (recordingAborted) { cleanupRecUI(); return; }
            handleRecordedBlob();
        };
        mediaRecorder.start();
        recordingStartAt = Date.now();
        document.getElementById("recOverlay").classList.add("active");
        document.getElementById("recordBtn").classList.add("recording");
        startRecTimer();
        if (navigator.vibrate) navigator.vibrate(30);
    } catch (err) {
        console.error("[REC] Error:", err);
        if (err.name === "NotAllowedError") toast("Izin mikrofon ditolak");
        else if (err.name === "NotFoundError") toast("Tidak ada mikrofon");
        else toast("Gagal mulai rekam: " + err.message);
    }
}
function startRecTimer() {
    clearInterval(recordingTimerInt);
    const el = document.getElementById("recTime");
    const tick = () => {
        const sec = (Date.now() - recordingStartAt) / 1000;
        el.textContent = formatDur(sec);
        if (sec >= 60) stopRecordingAndSend();
    };
    tick();
    recordingTimerInt = setInterval(tick, 200);
}
function cancelRecording() {
    if (!mediaRecorder) return;
    recordingAborted = true;
    try { mediaRecorder.stop(); } catch(e){}
    cleanupRecUI();
    toast("Rekaman dibatalkan");
}
function stopRecordingAndSend() {
    if (!mediaRecorder || mediaRecorder.state !== "recording") return;
    try { mediaRecorder.stop(); } catch(e){}
}
function cleanupRecUI() {
    clearInterval(recordingTimerInt);
    recordingTimerInt = null;
    document.getElementById("recOverlay").classList.remove("active");
    document.getElementById("recordBtn").classList.remove("recording");
    document.getElementById("recTime").textContent = "00:00";
}
function handleRecordedBlob() {
    const durationSec = Math.max(1, Math.round((Date.now() - recordingStartAt) / 1000));
    cleanupRecUI();
    if (recordedChunks.length === 0) { toast("Rekaman kosong"); return; }
    const blob = new Blob(recordedChunks, { type: recordedChunks[0].type || "audio/webm" });
    recordedChunks = [];
    if (blob.size > 5 * 1024 * 1024) { toast("Rekaman terlalu besar"); return; }
    const reader = new FileReader();
    reader.onload = e => {
        const dataUrl = e.target.result;
        if (dataUrl.length > MAX_VOICE_SIZE) {
            toast("Rekaman terlalu panjang/besar");
            return;
        }
        const msg = {
            username: CURRENT_USER.username,
            name: CURRENT_USER.name,
            avatar: CURRENT_USER.avatar,
            type: "voice",
            text: "",
            media: dataUrl,
            duration: durationSec,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };
        if (replyTarget) {
            msg.replyTo = {
                id: replyTarget.id,
                username: replyTarget.username,
                name: replyTarget.name,
                preview: replyTarget.preview
            };
        }
        toast("Mengirim voice...");
        DB.ref(CHAT_PATH).push(msg)
            .then(() => {
                toast("✓ Voice terkirim");
                cancelReply();
                if (navigator.vibrate) navigator.vibrate(40);
            })
            .catch(err => {
                console.error("[CHAT] Voice send error:", err);
                toast("Gagal kirim voice: " + err.message);
            });
    };
    reader.onerror = () => toast("Gagal baca rekaman");
    reader.readAsDataURL(blob);
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ VOICE PLAYBACK
   ═══════════════════════════════════════════════════════════════════════════ */
function toggleVoicePlay(ev, msgId) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }

    if (currentAudio) {
        try { currentAudio.pause(); currentAudio.currentTime = 0; } catch(e){}
        resetVoiceBtn();
    }
    if (currentAudioId === msgId) {
        currentAudioId = null;
        return;
    }
    const m = allMessages.find(x => x.id === msgId) || rawMessages.find(x => x.id === msgId);
    if (!m || !m.media) { toast("Audio tidak tersedia"); return; }

    const btn = document.querySelector('.voice-play[data-audio-id="' + msgId + '"]');
    const fill = document.getElementById("voiceFill_" + msgId);

    let audio;
    try {
        audio = new Audio();
        audio.src = m.media;
        audio.volume = 1.0;
        audio.preload = "auto";
        audio.setAttribute("playsinline", "");
    } catch(e) {
        console.error("[AUDIO] Create error:", e);
        toast("Gagal memuat audio");
        return;
    }
    currentAudio = audio;
    currentAudioBtn = btn;
    currentAudioFill = fill;
    currentAudioId = msgId;

    if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';

    audio.addEventListener("timeupdate", () => {
        if (currentAudioFill && audio.duration > 0 && isFinite(audio.duration)) {
            const pct = Math.min(100, (audio.currentTime / audio.duration) * 100);
            currentAudioFill.style.width = pct + "%";
        }
    });
    audio.addEventListener("ended", () => {
        resetVoiceBtn();
        currentAudioId = null;
    });
    audio.addEventListener("error", () => {
        toast("Gagal memutar audio");
        resetVoiceBtn();
        currentAudioId = null;
    });

    const p = audio.play();
    if (p !== undefined) {
        p.then(() => {}).catch(err => {
            console.error("[AUDIO] Play error:", err);
            toast("Tap sekali lagi untuk memutar");
            resetVoiceBtn();
            currentAudioId = null;
        });
    }
}
function resetVoiceBtn() {
    if (currentAudioBtn) {
        currentAudioBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
    }
    if (currentAudioFill) currentAudioFill.style.width = "0%";
    currentAudio = null;
    currentAudioBtn = null;
    currentAudioFill = null;
}

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ CONFIRM
   ═══════════════════════════════════════════════════════════════════════════ */
function closeConfirm() {
    document.getElementById("confirmOverlay").classList.remove("active");
    confirmCallback = null;
}
document.getElementById("confirmOkBtn").addEventListener("click", () => {
    if (typeof confirmCallback === "function") confirmCallback();
    closeConfirm();
});
document.getElementById("confirmOverlay").addEventListener("click", (e) => {
    if (e.target.id === "confirmOverlay") closeConfirm();
});

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ KEYBOARD
   ═══════════════════════════════════════════════════════════════════════════ */
document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        closeImagePreview();
        closeImageViewer();
        closeConfirm();
        closeMsgMenu();
        if (document.getElementById("recOverlay").classList.contains("active")) {
            cancelRecording();
        }
    }
});

/* ═══════════════════════════════════════════════════════════════════════════
   ⚡ CLEANUP
   ═══════════════════════════════════════════════════════════════════════════ */
window.addEventListener("beforeunload", () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        try { recordingAborted = true; mediaRecorder.stop(); } catch(e){}
    }
    if (recordStream) {
        try { recordStream.getTracks().forEach(t => t.stop()); } catch(e){}
    }
    if (currentAudio) {
        try { currentAudio.pause(); } catch(e){}
    }
});
